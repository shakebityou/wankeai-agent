# ==============================================================================
# Prometheus 抓取配置（任务书 3.1：OpenTelemetry + Prometheus + Grafana + Loki）
# ------------------------------------------------------------------------------
# 抓取目标：
#   app         → FastAPI 的 /metrics（prometheus_client 文本格式）
#   prometheus  → 自身
#
# 注意：容器内用服务名（app:8000）而非 127.0.0.1，因为 Prometheus 与 app
# 分属不同容器，共享 compose 默认网络 wkagent_default。
# ==============================================================================

global:
  # 15s：与 /health 的 30s 探测错开，避免同一时刻打满
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: wkagent
    env: ${WK_ENV:-dev}

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---------------------------------------------------------------------------
  # 应用指标（HTTP QPS/延迟、RAG 阈值分流、工具调用、LLM token、合规拦截）
  # ---------------------------------------------------------------------------
  - job_name: wkagent-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          component: backend

  # ---------------------------------------------------------------------------
  # Prometheus 自身（抓取成功率、TSDB 状态）
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
