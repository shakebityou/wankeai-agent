# Alembic configuration (production baseline: PostgreSQL 14).
#
# NOTE: this file must stay ASCII-only.
# Reason: alembic reads it via configparser with encoding="locale", which is GBK
# on a Chinese Windows host, so UTF-8 Chinese comments raise UnicodeDecodeError.
# Chinese explanations live in alembic/env.py (Python source, always UTF-8).
#
# The database URL is intentionally NOT set here. env.py reads it from
# app.core.config.Settings.resolved_db_url, so switching the relational backend
# (postgres / mssql / sqlite) only needs an environment variable change and
# credentials never enter version control.
#
# Common commands (run from backend/):
#   alembic revision --autogenerate -m "description"   # diff models -> migration
#   alembic upgrade head                               # apply all
#   alembic downgrade -1                               # roll back one step
#   alembic current                                    # show current revision
#   alembic history --verbose                          # list all revisions

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamp prefix in filenames so humans can order them by name.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamp timezone for generated revision files.
timezone = Asia/Shanghai

# Injected by env.py; left empty on purpose.
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format generated migrations (requires ruff installed).
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
