# 玩可爱智能客服 Agent —— 前端 Nginx 配置
#
# 部署形态（任务书 4.1）：静态资源 → 打包 dist/ → 由 Nginx 托管，
# 同时把 /bff/ 反向代理到 BFF 服务。
#
# 为什么不让前端直连 BFF 域名：
#   1. HC-1 / R5 红线要求前端只调 /bff/v1/*，同源路径才能静态验证；
#   2. 同源免 CORS，也免去 Cookie/SameSite 的一堆坑；
#   3. BFF 挂了可以在 Nginx 层给降级页，而不是让浏览器报 ERR_CONNECTION_REFUSED。
#
# 使用：cp deploy/nginx.conf /etc/nginx/conf.d/wankeai-frontend.conf
#      把 __BFF_UPSTREAM__ 换成实际 BFF 地址（如 10.0.1.20:8000）

upstream wankeai_bff {
    # __BFF_UPSTREAM__
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen       80;
    server_name  __FRONTEND_HOST__;

    # 前端是 hash 路由（createWebHashHistory），所以不需要 SPA fallback rewrite，
    # 所有路径都落到 index.html 即可。
    root  /usr/share/nginx/html/wankeai;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ── 安全响应头 ────────────────────────────────────────────
    # CSP 与 index.html 里的 meta 保持一致：只允许同源，禁止一切外链与内联脚本。
    # 注意：Vue 打包后仍有少量内联 style（Element Plus 动态尺寸），故 style-src 放开 'unsafe-inline'；
    # script-src 不放宽，任何注入脚本都会被拦。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── 压缩 ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── 静态资源 ─────────────────────────────────────────────
    # Vite 打包产物带内容哈希，可以长缓存；index.html 必须不缓存，
    # 否则发版后用户拿到的还是旧壳子、去请求已经删掉的旧 chunk。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        # ⚠️ nginx 的 add_header 是「覆盖」不是「继承」：只要这个 location 里
        # 出现了任意一条 add_header，server 级那 4 条安全头就**全部失效**。
        # index.html 恰恰是最需要 CSP 的文档（它是整个 SPA 的壳），
        # 所以这里必须把 4 条安全头原样重复一遍。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── BFF 反向代理 ─────────────────────────────────────────
    location /bff/ {
        proxy_pass         http://wankeai_bff;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ── 登录态 Cookie（wk_session）────────────────────────
        # 账号体系用 HttpOnly + SameSite=Lax 的会话 Cookie。
        # Nginx 默认就会透传 Cookie 头，这里显式写上是为了防止
        # 后续有人在 http{} 里加了 proxy_set_header Cookie "" 之类的全局规则。
        # 关键：不要在 Nginx 层改写 Set-Cookie，Domain/Path 由 BFF 决定，
        # 同源部署下 BFF 下发 Path=/ 即可，改写容易把 Domain 写错导致 Cookie 不下发。
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax; Secure";

        # SSE 关键：关闭缓冲，否则打字机会变成「憋一大段然后一次性刷出来」。
        # 这三行缺任何一行都可能失效：
        #   proxy_buffering off            —— 关 Nginx 攒批
        #   proxy_cache off                —— 关缓存
        #   X-Accel-Buffering no（后端的） —— 双保险，后端已设，这里再关一次
        proxy_buffering          off;
        proxy_cache              off;
        proxy_request_buffering  off;
        chunked_transfer_encoding on;

        # SSE 是长连接，读超时必须大于后端心跳间隔（后端 15s 一次 ping）。
        # 60s 足够容两次丢包，又不会让死连接占着 worker。
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 5s;

        # FE-06 批量导入可能上传较大 XLSX
        client_max_body_size 20m;
    }

    # ── 健康检查（不写访问日志，避免刷屏）────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # ── 错误页 ───────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    access_log /var/log/nginx/wankeai-frontend.access.log;
    error_log  /var/log/nginx/wankeai-frontend.error.log warn;
}
