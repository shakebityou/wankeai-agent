# 玩可爱智能客服 Agent —— 前端 Nginx 配置（Docker Compose 版）
#
# 与 `deploy/nginx.conf` 的差别只有三处，都是为了容器内运行：
#   1. 上游写死 compose 服务名 `app:8000`，不再用 __BFF_UPSTREAM__ 占位；
#   2. 站点根目录是镜像里的 /usr/share/nginx/html（不是 .../wankeai）；
#   3. 不再强制给 Cookie 加 Secure —— 本地一键部署是 http://localhost，
#      加了 Secure 浏览器会拒收，表现为「登录成功但立刻又变未登录」。
#      生产走 HTTPS 时由 compose 覆盖或改成 deploy/nginx.conf 那版。
#
# 其余（CSP、gzip、SSE 不缓冲、长缓存策略）与主机版逐条一致。

upstream wankeai_bff {
    server app:8000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 前端是 hash 路由（createWebHashHistory），不需要 SPA fallback rewrite，
    # 所有路径都落到 index.html 即可。
    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ── 安全响应头 ────────────────────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── 压缩 ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── 静态资源 ─────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        # ⚠️ nginx 的 add_header 是「覆盖」不是「继承」：只要这个 location 里
        # 出现了任意一条 add_header，server 级那 4 条安全头就**全部失效**。
        # index.html 恰恰是最需要 CSP 的文档（它是整个 SPA 的壳），
        # 所以这里必须把 4 条安全头原样重复一遍。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── BFF 反向代理 ─────────────────────────────────────────
    location /bff/ {
        proxy_pass         http://wankeai_bff;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 登录态 Cookie（wk_session）：透传，不改写 Domain/Path。
        proxy_pass_header Set-Cookie;

        # SSE 关键三行，缺一不可
        proxy_buffering          off;
        proxy_cache              off;
        proxy_request_buffering  off;
        chunked_transfer_encoding on;

        # SSE 长连接：读超时必须大于后端 15s 心跳
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 5s;

        # FE-06 批量导入可能上传较大 XLSX
        client_max_body_size 20m;
    }

    # ── 健康检查（不写访问日志，避免刷屏）────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # ── 错误页 ───────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
